<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Bot — Preflop Bot Acting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0F14; --surface: #161A23; --surface2: #1C2130;
    --border: #252A35; --gold: #E8C547; --blue: #4A9EFF;
    --text: #E0E4EF; --text-dim: #5A6070; --red: #E84747;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column; }

  header { border-bottom: 1px solid var(--border); padding: 12px 32px;
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 28px; }
  .bankroll-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .bankroll-val { font-size: 18px; color: var(--text-dim); }
  select { background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 6px 12px; }

  .game-layout { flex: 1; display: grid;
    grid-template-rows: auto 1fr auto auto auto;
    grid-template-areas: "bots" "center" "you" "actions" "log";
    padding: 20px 32px; gap: 14px; max-width: 800px; margin: 0 auto; width: 100%; }

  .bots-row { grid-area: bots; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .player-area { border: 1px solid var(--border); background: var(--surface); padding: 14px 18px; }
  .player-area.active-turn { border-color: var(--blue); }
  .player-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .player-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--text-dim); }
  .player-name.active { color: var(--blue); }
  .player-stack { font-size: 13px; color: var(--text-dim); }
  .bet-highlight { color: var(--gold); }
  .card-row { display: flex; gap: 6px; margin-top: 8px; }
  .card { width: 38px; height: 54px; background: #1E2535; border: 1px solid #2E3545;
    display: flex; align-items: center; justify-content: center; font-size: 20px; }

  .thinking-dots { display: inline-flex; gap: 3px; margin-left: 6px; }
  .thinking-dots span { width: 4px; height: 4px; background: var(--blue); border-radius: 50%;
    display: inline-block; animation: thinking 0.8s ease-in-out infinite; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking { 0%,100% { opacity:0.2; transform: scale(0.8); } 50% { opacity:1; transform: scale(1.1); } }

  .center-area { grid-area: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; }
  .pot-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2px; }
  .pot-display { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; }
  .community-slot { width: 44px; height: 62px; border: 1px dashed var(--border); background: #1C2130;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

  .you-area { grid-area: you; border: 1px solid var(--gold); background: var(--surface); padding: 14px 18px; }
  .you-area .player-name { color: var(--gold); }
  .card.face-up { background: white; border: 1px solid #ccc; }
  .card-rank { font-family: serif; font-weight: bold; font-size: 22px; }

  /* Waiting for bots — no action panel yet */
  .waiting-panel { grid-area: actions; border: 1px dashed var(--border); background: transparent;
    padding: 14px 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .waiting-text { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
  .waiting-dots span { width: 5px; height: 5px; background: var(--text-dim); border-radius: 50%;
    display: inline-block; animation: thinking 1s ease-in-out infinite; }
  .waiting-dots span:nth-child(2) { animation-delay: 0.25s; }
  .waiting-dots span:nth-child(3) { animation-delay: 0.5s; }

  .action-log { grid-area: log; border: 1px solid var(--border); background: var(--surface);
    padding: 12px 16px; font-size: 11px; }
  .log-header { font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text-dim); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(37,42,53,0.5); }
  .log-entry:last-child { border-bottom: none; }
  .log-hand { color: var(--text-dim); font-size: 10px; opacity: 0.5; margin-right: 4px; }
  .log-actor { color: var(--blue); }
  .log-action { color: var(--text); }
  .log-sep { color: var(--border); font-size: 10px; }
  .log-new { animation: log-appear 0.3s ease-out; }
  @keyframes log-appear { from { opacity:0; transform: translateX(-5px); } to { opacity:1; transform:none; } }
  .log-pending { opacity: 0.4; }
</style>
</head>
<body>
  <header>
    <div class="logo">POKER BOT</div>
    <div class="header-right">
      <div>
        <div class="bankroll-label">Bankroll</div>
        <div class="bankroll-val">0.0 BB</div>
      </div>
      <select><option>Leduc (Baseline)</option></select>
    </div>
  </header>

  <div class="game-layout">
    <div class="bots-row">
      <!-- BTN already acted -->
      <div class="player-area">
        <div class="player-header">
          <div class="player-name">BTN · P0</div>
          <div class="player-stack">18.0 BB</div>
        </div>
        <div style="font-size:11px;color:var(--text-dim)">Bet: <span class="bet-highlight">2.0 BB</span></div>
        <div class="card-row"><div class="card">🂠</div></div>
      </div>
      <!-- SB currently acting -->
      <div class="player-area active-turn">
        <div class="player-header">
          <div class="player-name active">
            SB · P1 <div class="thinking-dots"><span></span><span></span><span></span></div>
          </div>
          <div class="player-stack">19.5 BB</div>
        </div>
        <div style="font-size:11px;color:var(--text-dim)">Bet: <span class="bet-highlight">0.5 BB</span></div>
        <div class="card-row"><div class="card">🂠</div></div>
      </div>
    </div>

    <div class="center-area">
      <div>
        <div class="pot-label">Total Pot</div>
        <div class="pot-display">3.0 BB</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="community-slot">flop</div>
        <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px">PREFLOP</div>
      </div>
    </div>

    <div class="you-area">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <div class="player-name">BB · YOU · P2</div>
        <span style="font-size:11px;color:var(--text-dim)">Stack: 20.0 BB · Bet: 1.0 BB</span>
      </div>
      <div class="card-row">
        <div class="card face-up"><span class="card-rank" style="color:#e74c3c">Q♥</span></div>
      </div>
    </div>

    <!-- No action panel yet — waiting for bots to finish preflop -->
    <div class="waiting-panel">
      <span class="waiting-text">Opponents acting preflop</span>
      <div class="waiting-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="action-log">
      <div class="log-header">Action Log (last 10)</div>
      <div class="log-entry"><span class="log-sep">── Hand #1 ──────────────────────────────</span></div>
      <div class="log-entry log-new"><span class="log-hand">H1</span> <span class="log-actor">BTN</span>: <span class="log-action">Raise to 2 BB</span></div>
      <div class="log-entry log-pending"><span class="log-hand">H1</span> <span class="log-actor">SB</span>: <span class="log-action">acting...</span></div>
    </div>
  </div>
</body>
</html>
