<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Bot — Error State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0F14; --surface: #161A23; --surface2: #1C2130;
    --border: #252A35; --gold: #E8C547; --blue: #4A9EFF;
    --text: #E0E4EF; --text-dim: #5A6070; --red: #E84747; --red-bg: #1A0808;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column; }

  header { border-bottom: 1px solid var(--border); padding: 12px 32px;
    display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 28px; }
  .bankroll-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .bankroll-val { font-size: 18px; color: var(--red); }
  select { background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 6px 12px; }

  /* Error banner */
  .error-banner { background: var(--red-bg); border-bottom: 1px solid var(--red);
    padding: 12px 32px; display: flex; align-items: center; gap: 16px; }
  .error-icon { color: var(--red); font-size: 16px; flex-shrink: 0; }
  .error-text { flex: 1; font-size: 12px; }
  .error-title { color: var(--red); font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 2px; }
  .error-sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .retry-btn { padding: 8px 20px; border: 1px solid var(--red); background: transparent;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--red);
    cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .retry-btn:hover { background: var(--red); color: white; }

  /* Dimmed game layout behind */
  .game-layout { flex: 1; padding: 20px 32px; max-width: 800px; margin: 0 auto; width: 100%;
    opacity: 0.35; pointer-events: none; }
  .bots-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .player-area { border: 1px solid var(--border); background: var(--surface); padding: 14px 18px; }
  .player-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--text-dim); }
  .card-row { display: flex; gap: 6px; margin-top: 10px; }
  .card { width: 38px; height: 54px; background: #1E2535; border: 1px solid #2E3545;
    display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .center { border: 1px solid var(--border); background: var(--surface); padding: 20px;
    text-align: center; margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
  .action-panel { border: 1px solid var(--border); background: var(--surface2); padding: 14px 18px; }
  .action-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .action-btn { padding: 10px 18px; border: 1px solid var(--border); background: transparent;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>
  <header>
    <div class="logo">POKER BOT</div>
    <div class="header-right">
      <div>
        <div class="bankroll-label">Bankroll</div>
        <div class="bankroll-val">-3.5 BB</div>
      </div>
      <select><option>Leduc (Baseline)</option></select>
    </div>
  </header>

  <!-- Error banner -->
  <div class="error-banner">
    <div class="error-icon">✕</div>
    <div class="error-text">
      <div class="error-title">CONNECTION FAILED</div>
      <div class="error-sub">Could not reach the server. Your session is still active if the server recovers.</div>
    </div>
    <button class="retry-btn">RETRY</button>
  </div>

  <!-- Dimmed game beneath -->
  <div class="game-layout">
    <div class="bots-row">
      <div class="player-area">
        <div class="player-name">BTN · P0</div>
        <div class="card-row"><div class="card">🂠</div></div>
      </div>
      <div class="player-area">
        <div class="player-name">SB · P1</div>
        <div class="card-row"><div class="card">🂠</div></div>
      </div>
    </div>
    <div class="center">Pot: 4.5 BB · Community: K♣</div>
    <div class="action-panel">
      <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px">Your Action</div>
      <div class="action-buttons">
        <div class="action-btn">Fold</div>
        <div class="action-btn">Check</div>
        <div class="action-btn">Bet 1.1 BB</div>
      </div>
    </div>
  </div>
</body>
</html>
